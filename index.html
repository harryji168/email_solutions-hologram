<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Taipei 101 Hologram</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #e6f3f7; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .scan { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen;
          background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(53,224,255,.05) 3px 4px); }
  #start { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
           padding: 14px 26px; border-radius: 999px; border: 0; background: #35e0ff; color: #04222b; font-size: 1rem; font-weight: 600; }
  #mode { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
          padding: 8px 13px; border-radius: 999px; border: 1px solid #1c5666; background: rgba(0,0,0,.5); color: #35e0ff; font-size: .78rem; }
  #gest { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
          padding: 8px 13px; border-radius: 999px; border: 1px solid #1c5666; background: rgba(0,0,0,.5); color: #35e0ff; font-size: .78rem; }
  #gest.on { background: #35e0ff; color: #04222b; }
  body.pyramid #gest { border-color: #222; color: #555; background: #000; }
  #cam { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(56px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 72px;
         object-fit: cover; transform: scaleX(-1); border-radius: 8px; border: 1px solid #1c5666; opacity: .75; display: none; }
  #cam.on { display: block; }
  body.pyramid #cam.on { opacity: 0; width: 1px; height: 1px; }
  body.pyramid #mode { border-color: #222; color: #555; }
  #hint { position: fixed; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top, 0px)); text-align: center;
          font-size: .85rem; color: #8fa8b3; pointer-events: none; padding: 0 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="scan" id="scan"></div>
<div id="hint">Loading…</div>
<button id="start" type="button" hidden>Start hologram</button>
<button id="mode" type="button">Pyramid viewer</button>
<button id="gest" type="button">Hand gestures</button>
<video id="cam" playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// The screen is treated as a window into a box. The camera is the viewer's eye; as the phone
// tilts, the eye moves and the view through the window is re-projected (off-axis projection),
// so the model looks like a solid miniature sitting inside the phone.
const canvas = document.getElementById('view'), hint = document.getElementById('hint'), startBtn = document.getElementById('start');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();
camera.matrixAutoUpdate = true;

let W = 1, H = 1;                 // window size in world units (width is always 1)
const DEPTH = 1.1;                // how deep the box behind the screen is
const EYE = 2.4;                  // viewer distance from the screen, in screen widths
const GAIN = 1.6, MAXA = 0.6;    // tilt amplification and limit (radians)

scene.add(new THREE.HemisphereLight(0xdff6ff, 0x0b1a24, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(0.6, 1.5, 1.2); scene.add(sun);
const rim = new THREE.DirectionalLight(0x35e0ff, 0.5); rim.position.set(-1, 0.4, -0.6); scene.add(rim);

// grid box behind the screen: this is what makes the depth readable
let box;
function buildBox() {
  if (box) scene.remove(box);
  const pts = [], n = 8, x0 = -W/2, x1 = W/2, y0 = -H/2, y1 = H/2, z1 = -DEPTH;
  const L = (a, b) => pts.push(...a, ...b);
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = x0 + W * t, y = y0 + H * t, z = z1 * t;
    L([x, y0, 0], [x, y0, z1]); L([x, y1, 0], [x, y1, z1]); L([x, y0, z1], [x, y1, z1]);   // floor, ceiling, back verticals
    L([x0, y, 0], [x0, y, z1]); L([x1, y, 0], [x1, y, z1]); L([x0, y, z1], [x1, y, z1]);   // side walls, back horizontals
    L([x0, y0, z], [x1, y0, z]); L([x0, y1, z], [x1, y1, z]); L([x0, y0, z], [x0, y1, z]); L([x1, y0, z], [x1, y1, z]);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  box = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x35e0ff, transparent: true, opacity: 0.28 }));
  scene.add(box);
}

const pivot = new THREE.Group(); scene.add(pivot);   // tilted so we look down into the rooms
const spinner = new THREE.Group(); pivot.add(spinner);
let userScale = 1;
const MODELS = {
  taipei101: { file: 'taipei101.glb', label: 'Taipei 101', tilt: Math.PI / 2, y: 0, z: 1, length: 1.55 }   // base on the back wall, top pointing out of the screen,
};
let current = 'taipei101', loaded = null, size = null;
function place() {
  const m = MODELS[current];
  pivot.rotation.x = m.tilt;
  pivot.position.set(0, H * m.y, -DEPTH * m.z);
  let k = 1;
  if (size) k = Math.min(m.length / size.y, 0.9 * W / Math.max(size.x, size.z));   // tower length runs front to back
  pivot.scale.setScalar(k * userScale);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  W = 1; H = h / w;
  if (H < 1) { W = w / h; H = 1; }       // landscape: keep the short side at 1
  buildBox(); place(); if (typeof pyramid !== 'undefined') box.visible = !(pyramid || sheet);
}
addEventListener('resize', resize); resize();

function show(name) {
  current = name; userScale = 1;
  if (loaded) { spinner.remove(loaded); loaded = null; }
  hint.hidden = false; hint.textContent = 'Loading…';
  new THREE.GLTFLoader().load(MODELS[name].file, g => {
    if (current !== name) return;
    const b = new THREE.Box3().setFromObject(g.scene), c = b.getCenter(new THREE.Vector3());
    size = b.getSize(new THREE.Vector3());
    g.scene.position.set(-c.x, -b.min.y, -c.z);
    loaded = g.scene; spinner.add(loaded); spinner.rotation.y = name === 'taipei101' ? 0.6 : 0; place();
    if (pyramid || sheet) return;
    hint.textContent = 'Tilt the phone to see the tower rise out of the screen. Drag to turn, pinch to zoom.';
    setTimeout(() => { if (!(pyramid || sheet)) hint.hidden = true; }, 6000);
  }, undefined, () => { hint.textContent = 'The model could not be loaded. Reload the page to try again.'; });
}
show(current);

// ---- viewer eye position, driven by phone tilt (or mouse, or a gentle sway) ----
let ax = 0, ay = 0, tax = 0, tay = 0;   // current and target view angles (radians)
let base = null, gotTilt = false, lastInput = 0;
function onTilt(e) {
  if (e.beta == null || e.gamma == null) return;
  let b = e.beta, g = e.gamma;
  const o = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (o === 90) [b, g] = [-g, b]; else if (o === 270 || o === -90) [b, g] = [g, -b];
  if (!base) base = { b, g };
  gotTilt = true;
  const rad = Math.PI / 180, cl = v => Math.max(-MAXA, Math.min(MAXA, v));
  tax = cl(-(g - base.g) * rad * GAIN);      // left/right
  tay = cl((b - base.b) * rad * GAIN);       // up/down
}
function listen() { addEventListener('deviceorientation', onTilt); }
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
  startBtn.hidden = false;                   // iPhone: motion access must be asked for from a tap
  startBtn.addEventListener('click', () => {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') listen(); }).catch(() => {}).finally(() => { startBtn.hidden = true; });
  });
} else if ('DeviceOrientationEvent' in window) listen();
addEventListener('mousemove', e => {         // desktop: the mouse stands in for tilt
  if (gotTilt) return; lastInput = performance.now();
  tax = (e.clientX / innerWidth - 0.5) * 2 * MAXA; tay = -(e.clientY / innerHeight - 0.5) * 2 * MAXA * 0.7;
});
canvas.addEventListener('dblclick', () => { base = null; });   // re-centre

// ---- drag to turn, pinch to zoom ----
const ptrs = new Map(); let pinch0 = 0, scale0 = 1, autoSpin = !matchMedia('(prefers-reduced-motion: reduce)').matches;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); autoSpin = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); scale0 = userScale; } });
canvas.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId); if (!prev) return; ptrs.set(e.pointerId, e);
  if (ptrs.size === 1 && e.pointerType !== 'mouse' || (e.pointerType === 'mouse' && e.buttons)) spinner.rotation.y += (e.clientX - prev.clientX) * 0.01;
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()];
    userScale = Math.max(0.3, Math.min(3, scale0 * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch0)); place(); }
});
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, e => { ptrs.delete(e.pointerId);
  if (pyramid) { userScale = Math.min(1, userScale); try { localStorage.setItem('pyramidSize', String(userScale)); } catch (err) {} } }));
canvas.addEventListener('wheel', e => { userScale = Math.max(0.6, Math.min(3, userScale * (e.deltaY < 0 ? 1.08 : 0.93))); place(); e.preventDefault(); }, { passive: false });

// ---- pyramid viewer mode: four side views around the centre, for a plastic hologram pyramid ----
const scanEl = document.getElementById('scan'), modeBtn = document.getElementById('mode');
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 5000);
var pyramid = false, sheet = false, wasStartHidden = true, wake = null;
const MODES = ['tilt', 'pyramid', 'sheet', 'screen'];
var upright = false;
const NEXT = { tilt: 'Pyramid viewer', pyramid: 'Sheet viewer', sheet: 'Big screen', screen: 'Exit' };
const TIPS = { pyramid: 'Pinch to make the four towers fit your pyramid, then put the pyramid over the centre. The size is remembered.',
               screen: 'Big screen view for a projector or TV. Use full screen in your browser.',
               sheet: 'Turn the brightness up. Lean a clear sheet at 45° over the screen, top edge toward you, and look from this side.' };
let modeName = 'tilt';
function setMode(name) {
  const was = modeName; modeName = name; pyramid = name === 'pyramid'; sheet = name === 'sheet' || name === 'screen'; upright = name === 'screen';
  const special = pyramid || sheet;
  userScale = 1;
  if (pyramid) { try { userScale = Math.max(0.3, Math.min(1, parseFloat(localStorage.getItem('pyramidSize')) || 1)); } catch (e) {} }
  document.body.classList.toggle('pyramid', special);
  modeBtn.textContent = NEXT[name];
  scanEl.hidden = special; box.visible = !special;
  if (special) {
    if (was === 'tilt') wasStartHidden = startBtn.hidden;
    startBtn.hidden = true; hint.hidden = false; hint.textContent = TIPS[name];
    setTimeout(() => { if (modeName === name) hint.hidden = true; }, 8000);
    if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
  } else {
    startBtn.hidden = wasStartHidden; hint.hidden = true; if (wake) { wake.release().catch(() => {}); wake = null; }
    renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); place();
  }
  try { history.replaceState(null, '', special ? '#' + name : location.pathname); } catch (e) {}
}
modeBtn.addEventListener('click', () => setMode(MODES[(MODES.indexOf(modeName) + 1) % MODES.length]));
if (['#pyramid', '#sheet', '#screen'].includes(location.hash)) setMode(location.hash.slice(1));

// single clear sheet at 45 degrees: one large view, tower top pointing at the viewer's edge of the screen
function renderSheet() {
  renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight); renderer.clear();
  if (!size) return;
  const w = innerWidth, h = innerHeight, halfLen = size.y * 0.54 / userScale, halfWid = halfLen * w / h;
  pivot.rotation.x = 0; pivot.position.set(0, 0, 0); pivot.scale.setScalar(1);
  if (!gestures) spinner.rotation.y += 0.006;
  ortho.left = -halfWid; ortho.right = halfWid; ortho.top = halfLen; ortho.bottom = -halfLen; ortho.updateProjectionMatrix();
  ortho.position.set(0, size.y / 2 - 6, 1500); ortho.up.set(0, 1, 0); ortho.lookAt(0, size.y / 2 - 6, 0);
  ortho.rotateZ(upright ? 0 : Math.PI); ortho.updateMatrixWorld();
  renderer.render(scene, ortho);
}

// ---- hand gestures by camera: open hand moves left/right to turn, pinch and move up/down to zoom ----
var gestures = false;
const gestBtn = document.getElementById('gest'), camEl = document.getElementById('cam');
let landmarker = null, camStream = null, prevHand = null, lastVideoTime = -1;
function say(text, ms) { hint.hidden = false; hint.textContent = text; if (ms) setTimeout(() => { if (hint.textContent === text) hint.hidden = true; }, ms); }
async function startGestures() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('This browser cannot use the camera here.', 6000); return; }
  gestBtn.disabled = true; say('Starting the camera…');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 }, audio: false });
    camEl.srcObject = camStream; await camEl.play();
    if (!landmarker) {
      say('Loading hand tracking…');
      const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
      const mp = await import(V + '/vision_bundle.mjs');
      const files = await mp.FilesetResolver.forVisionTasks(V + '/wasm');
      landmarker = await mp.HandLandmarker.createFromOptions(files, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' },
        runningMode: 'VIDEO', numHands: 1 });
    }
    gestures = true; autoSpin = false; prevHand = null;
    gestBtn.classList.add('on'); camEl.classList.add('on'); gestBtn.textContent = 'Gestures on';
    say('Move an open hand left or right to turn. Pinch thumb and finger, then move up or down to zoom.', 9000);
  } catch (e) {
    stopGestures();
    say(e && e.name === 'NotAllowedError' ? 'Camera access was not allowed, so hand gestures are off.' : 'Hand gestures could not start on this device.', 7000);
  }
  gestBtn.disabled = false;
}
function stopGestures() {
  gestures = false; prevHand = null;
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  camEl.srcObject = null; camEl.classList.remove('on'); gestBtn.classList.remove('on'); gestBtn.textContent = 'Hand gestures';
}
gestBtn.addEventListener('click', () => { if (gestures) { stopGestures(); hint.hidden = true; } else startGestures(); });
function trackHand(now) {
  if (!gestures || !landmarker || camEl.readyState < 2 || camEl.currentTime === lastVideoTime) return;
  lastVideoTime = camEl.currentTime;
  let res; try { res = landmarker.detectForVideo(camEl, now); } catch (e) { return; }
  const lm = res && res.landmarks && res.landmarks[0];
  if (!lm) { prevHand = null; return; }
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const hand = { x: lm[9].x, y: lm[9].y, pinch: d(4, 8) / (d(0, 9) || 1) < 0.35 };
  if (prevHand) {
    const dx = hand.x - prevHand.x, dy = hand.y - prevHand.y;
    if (Math.abs(dx) < 0.25 && Math.abs(dy) < 0.25) {            // ignore jumps when tracking re-acquires
      if (hand.pinch && prevHand.pinch) { userScale = Math.max(0.3, Math.min(3, userScale * Math.exp(-dy * 3))); if (!pyramid && !sheet) place(); }
      else if (!hand.pinch) spinner.rotation.y -= dx * 7;         // camera image is unmirrored: hand moving right turns the tower right
    }
  }
  prevHand = hand;
}

function renderPyramid() {
  if (!size) { renderer.clear(); return; }
  const w = innerWidth, h = innerHeight, S = Math.min(w, h) * Math.min(1, userScale), cx = w / 2, cy = h / 2;   // pinch resizes the whole layout to fit the pyramid
  const gap = S * 0.07, r = S / 2 - gap, tw = S * 0.34;      // r: cell length away from the centre, tw: cell width
  const halfLen = size.y * 0.52, halfWid = halfLen * tw / r;
  pivot.rotation.x = 0; pivot.position.set(0, 0, 0); pivot.scale.setScalar(1);
  if (!gestures) spinner.rotation.y += 0.006;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h); renderer.clear();
  renderer.setScissorTest(true);
  // each cell: [x, y (from bottom), width, height, camera roll]; the tower's top always points away from the centre
  const cells = [[cx - tw / 2, cy + gap, tw, r, 0], [cx + gap, cy - tw / 2, r, tw, Math.PI / 2],
                 [cx - tw / 2, cy - gap - r, tw, r, Math.PI], [cx - gap - r, cy - tw / 2, r, tw, -Math.PI / 2]];
  cells.forEach(([x, y, vw, vh, roll], i) => {
    const a = i * Math.PI / 2, tall = vh > vw;
    ortho.left = tall ? -halfWid : -halfLen; ortho.right = -ortho.left;
    ortho.top = tall ? halfLen : halfWid; ortho.bottom = -ortho.top; ortho.updateProjectionMatrix();
    ortho.position.set(Math.sin(a) * 1500, size.y / 2 - 6, Math.cos(a) * 1500);
    ortho.up.set(0, 1, 0); ortho.lookAt(0, size.y / 2 - 6, 0); ortho.rotateZ(roll); ortho.updateMatrixWorld();
    renderer.setViewport(x, y, vw, vh); renderer.setScissor(x, y, vw, vh);
    renderer.render(scene, ortho);
  });
}

renderer.setAnimationLoop(t => {
  trackHand(t);
  if (pyramid) { renderPyramid(); return; }
  if (sheet) { renderSheet(); return; }
  if (!gotTilt && t - lastInput > 3000) { tax = Math.sin(t / 1700) * 0.38; tay = Math.sin(t / 2300) * 0.16; }   // idle sway
  ax += (tax - ax) * 0.12; ay += (tay - ay) * 0.12;
  if (autoSpin) spinner.rotation.y += 0.003;
  const ex = EYE * Math.sin(ax), ey = EYE * Math.sin(ay), ez = EYE * Math.cos(ax) * Math.cos(ay);
  const n = 0.05, f = 50, k = n / ez;
  camera.position.set(ex, ey, ez); camera.rotation.set(0, 0, 0); camera.updateMatrixWorld();
  camera.projectionMatrix.makePerspective((-W/2 - ex) * k, (W/2 - ex) * k, (H/2 - ey) * k, (-H/2 - ey) * k, n, f);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
