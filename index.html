<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apartment Hologram AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #070b12; color: #e6f3f7; font-family: system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; }
  #ar { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 14px 26px; border-radius: 999px;
        border: 0; background: #35e0ff; color: #04222b; font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
<!-- ar-scale="auto" lets the visitor pinch the model down to table or palm size in AR -->
<model-viewer src="apartment.glb" alt="3D model of a one-bedroom apartment"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1.1">
  <button slot="ar-button" id="ar">View in your space</button>
</model-viewer>
</body>
</html>
